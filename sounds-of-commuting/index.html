  <body>
    <div id="basemap"></div>
    <div id="veil"></div>
    <canvas id="map"></canvas>
    <header id="hud">
      <h1 id="title">Sound of commuting</h1>
      <p id="meta"><span id="clock">…</span><span id="count" aria-live="polite">—</span></p>
      <p id="speed" role="group" aria-label="Speed">
        <button id="speed-1" type="button" class="on" aria-pressed="true">×1</button>
        <button id="speed-20" type="button" aria-pressed="false">×20</button>
      </p>
    </header>
    <nav id="nav" aria-label="Controls">
      <button id="view-map" type="button" class="on" aria-pressed="true">Map</button>
      <button id="view-bars" type="button" aria-pressed="false">Lines</button>
      <button id="listen" type="button" class="on" aria-pressed="true">Mute</button>
      <button id="theme" type="button" aria-pressed="false">Night</button>
      <button id="basemap-toggle" type="button" aria-pressed="false">Basemap</button>
    </nav>
    <nav id="corner" aria-label="Language">
      <button id="info" type="button" aria-expanded="false" aria-controls="about">Info</button>
      <button id="lang-en" type="button" class="on" aria-pressed="true">EN</button>
      <button id="lang-tr" type="button" aria-pressed="false">TR</button>
    </nav>
    <div id="about-layer" hidden>
      <div id="about-scrim"></div>
      <aside id="about" role="dialog" aria-modal="true" aria-labelledby="about-title">
        <h2 id="about-title">Sound of commuting</h2>
        <p id="about-body"></p>
        <div id="about-sources">
          <p id="about-src-kicker">Sources</p>
          <p class="src-row">
            <span id="about-src-insp">Inspiration</span>
            <a href="https://www.trainjazz.com/" target="_blank" rel="noopener">TrainJazz</a>
          </p>

            <span id="about-src-data">Data</span>

            <a href="https://data.ibb.gov.tr/dataset/metro-istanbul-sefer-tarifeleri-listesi-web-servisi" target="_blank" rel="noopener">Metro İstanbul</a>,

      </aside>
    </div>
