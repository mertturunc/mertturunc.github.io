<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Draft Tournament</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f7f7f7;
    --panel: #ffffff;
    --border: #d7d7d7;
    --text: #111827;
    --muted: #4b5563;
    --error: #b91c1c;
    --warn: #92400e;
    --ok: #166534;
    --primary: #2563eb;
    --now: #fef3c7;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
    font-family: system-ui, -apple-system, Segoe UI, sans-serif;
    line-height: 1.35;
    color: var(--text);
    background: var(--bg);
  }

  .wrap {
    max-width: 1100px;
    margin: 0 auto;
    padding: 12px;
  }

  h1 {
    margin: 0 0 4px;
    font-size: 1.15rem;
  }

  .sub {
    margin: 0 0 10px;
    color: var(--muted);
    font-size: 0.8rem;
  }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
    margin-bottom: 10px;
  }

  .toolbar .spacer { flex: 1; }

  .status-bar {
    font-size: 0.78rem;
    color: var(--muted);
    margin-bottom: 10px;
  }

  .status-bar.error { color: var(--error); }
  .status-bar.ok { color: var(--ok); }

  .steps {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-bottom: 12px;
  }

  .steps button {
    border: 1px solid var(--border);
    background: #fff;
    border-radius: 4px;
    padding: 5px 8px;
    font-size: 0.75rem;
    cursor: pointer;
  }

  .steps button.active {
    background: #eef3ff;
    border-color: #c5d4ff;
    color: #1e3a8a;
    font-weight: 600;
  }

  .steps button:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }

  section.panel {
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px;
    background: var(--panel);
    margin-bottom: 10px;
  }

  section.panel h2 {
    margin: 0 0 8px;
    font-size: 0.95rem;
  }

  .hint {
    margin: 0 0 10px;
    color: var(--muted);
    font-size: 0.78rem;
  }

  label {
    display: block;
    font-size: 0.76rem;
    color: var(--muted);
    margin-bottom: 3px;
  }

  input[type="text"],
  input[type="number"],
  input[type="search"],
  select,
  button,
  textarea {
    font: inherit;
    font-size: 0.85rem;
  }

  input[type="text"],
  input[type="number"],
  input[type="search"],
  select,
  textarea {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 6px 8px;
    background: #fff;
  }

  button {
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 6px 10px;
    background: #fff;
    cursor: pointer;
  }

  button:disabled {
    opacity: 0.55;
    cursor: not-allowed;
  }

  button.primary {
    background: #eef3ff;
    border-color: #c5d4ff;
    color: #1e3a8a;
    font-weight: 600;
  }

  button.danger {
    color: var(--error);
    border-color: #fecaca;
    background: #fef2f2;
  }

  .row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: end;
    margin-bottom: 8px;
  }

  .row > * { min-width: 0; }
  .grow { flex: 1; }
  .field { margin-bottom: 8px; }

  .manager-row {
    display: grid;
    grid-template-columns: 36px 1fr auto;
    gap: 8px;
    align-items: center;
    margin-bottom: 6px;
  }

  .manager-row .idx {
    font-size: 0.8rem;
    color: var(--muted);
    text-align: center;
  }

  .kit-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 8px;
  }

  .kit-card {
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px;
    background: #fafafa;
    overflow: hidden;
    color: var(--text);
  }

  .kit-card.themed {
    background: linear-gradient(45deg, var(--c1) 50%, var(--c2) 50%);
  }

  .kit-card h3 {
    margin: 0 0 6px;
    font-size: 0.88rem;
    color: var(--text);
  }

  .kit-card.themed h3,
  .kit-card.themed .kit-picked {
    background: rgba(255, 255, 255, 0.9);
    border-radius: 4px;
    padding: 6px 8px;
  }

  .kit-picked {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 6px;
    font-size: 0.82rem;
    color: var(--text);
  }

  .kit-picked-top {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .kit-strip {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .kit-strip img {
    width: 56px;
    height: 56px;
    object-fit: contain;
    background: rgba(0,0,0,0.04);
    border-radius: 4px;
    border: 1px solid var(--border);
  }

  .kit-picked img.crest,
  .club-opt img.crest,
  .crest {
    width: 28px;
    height: 28px;
    object-fit: contain;
  }

  .club-opt img.kit-thumb {
    width: 36px;
    height: 36px;
    object-fit: contain;
  }

  .crest-initial {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: #1e3a8a;
    color: #fff;
    font-size: 0.62rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    vertical-align: middle;
    flex-shrink: 0;
  }

  .adds-line {
    display: flex;
    align-items: center;
    gap: 8px;
    list-style: none;
    margin: 0 0 6px;
  }

  .club-list {
    max-height: 280px;
    overflow: auto;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: #fff;
  }

  .club-opt {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    text-align: left;
    border: 0;
    border-bottom: 1px solid #eee;
    border-radius: 0;
    padding: 6px 8px;
    background: #fff;
  }

  .club-opt .club-opt-meta {
    flex: 1;
    min-width: 0;
  }

  .club-opt .club-opt-name {
    font-size: 0.8rem;
    font-weight: 600;
  }

  .club-opt .club-opt-sub {
    font-size: 0.68rem;
    color: var(--muted);
  }

  .club-opt:hover { background: #f3f4f6; }
  .club-opt:disabled { opacity: 0.4; }

  .order-list li.themed {
    background: linear-gradient(45deg, var(--c1) 50%, var(--c2) 50%);
    color: var(--text);
  }

  .order-list li.themed .name {
    background: rgba(255, 255, 255, 0.9);
    border-radius: 4px;
    padding: 2px 6px;
  }

  .order-list {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .order-list li {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px;
    border: 1px solid var(--border);
    border-radius: 4px;
    margin-bottom: 6px;
    background: #fff;
  }

  .order-list .pick-num {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: #eef3ff;
    color: #1e3a8a;
    display: grid;
    place-items: center;
    font-size: 0.8rem;
    font-weight: 700;
  }

  .order-list .name {
    flex: 1;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }

  .now-banner {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    background: #fffbeb;
    border: 1px solid #f59e0b;
    border-radius: 6px;
    padding: 10px 12px;
    margin-bottom: 10px;
    font-size: 1rem;
    font-weight: 700;
    color: #111827;
  }

  .now-banner .now-label {
    color: #92400e;
  }

  .now-banner .now-text {
    flex: 1;
    min-width: 0;
  }

  .draft-layout {
    display: grid;
    grid-template-columns: 1.2fr 1fr;
    gap: 10px;
  }

  @media (max-width: 800px) {
    .draft-layout { grid-template-columns: 1fr; }
  }

  .filters {
    display: grid;
    grid-template-columns: 1fr 90px 110px 90px 90px;
    gap: 6px;
    margin-bottom: 8px;
  }

  @media (max-width: 700px) {
    .filters { grid-template-columns: 1fr 1fr; }
  }

  .player-list {
    max-height: 420px;
    overflow: auto;
    border: 1px solid var(--border);
    border-radius: 4px;
  }

  .player-row {
    display: grid;
    grid-template-columns: 40px 1fr auto;
    gap: 8px;
    align-items: center;
    width: 100%;
    text-align: left;
    border: 0;
    border-bottom: 1px solid #eee;
    border-radius: 0;
    padding: 7px 8px;
    background: #fff;
  }

  .player-row:hover { background: #f0f7ff; }
  .player-row:disabled { opacity: 0.4; background: #f9fafb; }

  .ovr {
    font-weight: 700;
    font-size: 0.95rem;
    text-align: center;
  }

  .player-meta {
    font-size: 0.72rem;
    color: var(--muted);
  }

  .pos-badge {
    font-size: 0.72rem;
    font-weight: 600;
    color: #374151;
    background: #f3f4f6;
    border-radius: 3px;
    padding: 2px 6px;
  }

  .squads {
    display: grid;
    gap: 8px;
    max-height: 520px;
    overflow: auto;
  }

  .squad {
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px;
    background: #fafafa;
  }

  .squad.current {
    border-color: #f59e0b;
    background: #fffbeb;
    order: -1;
  }

  .squad-now {
    margin-left: auto;
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: #92400e;
    background: #fde68a;
    border-radius: 3px;
    padding: 2px 6px;
  }

  .squad h3 {
    margin: 0 0 6px;
    font-size: 0.82rem;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .squad ul {
    margin: 0;
    padding: 0;
    list-style: none;
    font-size: 0.75rem;
  }

  .squad li {
    display: flex;
    gap: 6px;
    align-items: baseline;
    padding: 2px 0;
    border-bottom: 1px solid #eee;
  }

  .squad li .slot { color: var(--muted); width: 18px; }

  .squad-pos-group {
    margin-top: 6px;
  }

  .squad-pos-group:first-of-type {
    margin-top: 2px;
  }

  .squad-pos-label {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
    padding-bottom: 2px;
    margin-bottom: 2px;
  }

  .squad-pos-label .count {
    font-weight: 600;
    letter-spacing: 0;
    text-transform: none;
  }

  .squad li .pos-tag {
    flex: 0 0 28px;
    font-size: 0.68rem;
    font-weight: 700;
    color: #374151;
  }

  .squad li .ovr-tag {
    flex: 0 0 22px;
    font-weight: 700;
  }

  .squad li .name-tag {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .squad-empty {
    color: var(--muted);
    font-size: 0.72rem;
    padding: 2px 0 4px;
  }

  .transfer-block {
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px;
    margin-bottom: 10px;
    background: #fafafa;
  }

  .transfer-block.warn {
    border-color: #f59e0b;
    background: #fffbeb;
  }

  .transfer-block h3 {
    margin: 0 0 6px;
    font-size: 0.9rem;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .transfer-block h4 {
    margin: 10px 0 4px;
    font-size: 0.78rem;
    color: var(--muted);
  }

  .adds-meta {
    font-size: 0.78rem;
    margin: 0 0 6px;
    color: var(--text);
  }

  .adds-meta strong {
    color: var(--warn);
  }

  .transfer-block ul {
    margin: 0;
    padding-left: 18px;
    font-size: 0.8rem;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.82rem;
    background: #fff;
  }

  th, td {
    border: 1px solid var(--border);
    padding: 6px 8px;
    text-align: left;
  }

  th { background: #f3f4f6; font-size: 0.75rem; }

  td.num, th.num { text-align: center; }

  .mgr-cell {
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
  }

  .mgr-cell .team-id-name {
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .score-inputs {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .score-inputs input {
    width: 52px;
    text-align: center;
  }

  .matchday {
    margin-bottom: 14px;
  }

  .matchday h3 {
    margin: 0 0 6px;
    font-size: 0.85rem;
  }

  .fixture-row {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 8px;
    align-items: center;
    padding: 8px;
    border: 1px solid var(--border);
    border-radius: 4px;
    margin-bottom: 6px;
    background: #fff;
  }

  .team-id {
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
  }

  .team-id-home { justify-content: flex-end; }
  .team-id-away { justify-content: flex-start; }

  .team-id-name {
    font-size: 0.82rem;
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .fixture-row .vs { font-size: 0.75rem; color: var(--muted); text-align: center; }

  .hidden { display: none !important; }

  .nav-row {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    flex-wrap: wrap;
  }

  .empty {
    color: var(--muted);
    font-size: 0.8rem;
    padding: 8px;
  }

  #fileImport { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Draft Tournament</h1>
  <p class="sub">Host tool: kits → pick order → snake draft (18) → transfers → fixtures → standings</p>

  <div class="toolbar">
    <button type="button" id="btnExport" class="secondary">Export JSON</button>
    <button type="button" id="btnImport">Import JSON</button>
    <input type="file" id="fileImport" accept="application/json,.json" />
    <span class="spacer"></span>
    <button type="button" id="btnReset" class="danger">Reset tournament</button>
  </div>

  <div id="statusBar" class="status-bar">Loading player database…</div>

  <div class="steps" id="steps"></div>

  <div id="app" class="hidden"></div>
</div>

<script>
(function () {
  "use strict";

  const STORAGE_KEY = "draft-tournament-v1";
  const PICKS_PER_TEAM = 18;
  const PHASES = [
    { id: "setup", label: "Setup" },
    { id: 1, label: "1 Kits" },
    { id: 2, label: "2 Order" },
    { id: 3, label: "3 Draft" },
    { id: 4, label: "4 Transfers" },
    { id: 5, label: "5 Fixtures" },
    { id: 6, label: "6 Results" },
  ];

  /** @type {Array<{id:string, displayName:string, search:string, overallRating:number, firstName:string, lastName:string, commonName:string|null, leagueName:string, nationality:any, team:any, position:any}>} */
  let players = [];
  /** @type {Map<string|number, {id:string|number, label:string, imageUrl:string}>} */
  let clubsById = new Map();
  /** @type {Array<{id:string|number, label:string, imageUrl:string}>} */
  let clubs = [];
  /** @type {Map<string, typeof players[0]>} */
  let playersById = new Map();
  /** @type {Map<string|number, number>} */
  let rosterByClubId = new Map();
  /** @type {Array<{name:string, type:string, clubHints:string[], players:Array<{pos:string, name:string}>}>} */
  let sidePack = [];
  /** @type {Map<string, {id:number|string, label:string, kits:number, c1:number[]|null, c2:number[]|null, imageUrl:string, kitUrl:string}>} */
  let teamsById = new Map();
  /** @type {Array<{id:number|string, label:string, kits:number, c1:number[]|null, c2:number[]|null, imageUrl:string, kitUrl:string}>} */
  let kitClubs = [];

  let teamAliases = {};
  let assetBase = "";
  let pathCrest = "";
  let pathKit = "";

  const MIN_CLUB_ROSTER = 17;

  function applyAssetPath(tpl, id, variant) {
    if (!tpl) return "";
    return String(tpl)
      .replace(/\{id\}/g, String(id))
      .replace(/\{v\}/g, String(variant == null ? 0 : variant));
  }

  function crestUrl(teamId) {
    if (!assetBase || !pathCrest || teamId == null || teamId === "") return "";
    return assetBase + applyAssetPath(pathCrest, teamId, 0);
  }

  function kitUrl(teamId, variant) {
    if (!assetBase || !pathKit || teamId == null || teamId === "") return "";
    return assetBase + applyAssetPath(pathKit, teamId, variant);
  }

  function rgbCss(arr) {
    if (!arr || arr.length < 3) return null;
    return "rgb(" + arr[0] + "," + arr[1] + "," + arr[2] + ")";
  }

  function softRgb(arr, alpha) {
    if (!arr || arr.length < 3) return null;
    const a = alpha == null ? 0.18 : alpha;
    return "rgba(" + arr[0] + "," + arr[1] + "," + arr[2] + "," + a + ")";
  }

  function contrastText(arr) {
    if (!arr || arr.length < 3) return "#111";
    const r = arr[0] / 255;
    const g = arr[1] / 255;
    const b = arr[2] / 255;
    const L = 0.2126 * r + 0.7152 * g + 0.0722 * b;
    return L > 0.55 ? "#111827" : "#ffffff";
  }

  function teamTheme(teamId) {
    const t = teamsById.get(String(teamId));
    if (!t) return null;
    return t;
  }

  function applyTeamTheme(el, teamId) {
    const t = teamTheme(teamId);
    if (!t || !t.c1) {
      el.classList.remove("themed");
      el.style.removeProperty("--c1");
      el.style.removeProperty("--c2");
      el.style.removeProperty("--c1-soft");
      el.style.removeProperty("--c2-soft");
      el.style.removeProperty("--c-text");
      return;
    }
    const c2 = t.c2 || t.c1;
    el.classList.add("themed");
    el.style.setProperty("--c1", rgbCss(t.c1));
    el.style.setProperty("--c2", rgbCss(c2));
    el.style.setProperty("--c1-soft", softRgb(t.c1, 0.24));
    el.style.setProperty("--c2-soft", softRgb(c2, 0.24));
    el.style.setProperty("--c-text", "#111827");
  }

  function crestImgEl(url) {
    if (!url) return null;
    const img = document.createElement("img");
    img.src = url;
    img.alt = "";
    img.className = "crest";
    img.loading = "lazy";
    img.onerror = function () { img.style.display = "none"; };
    return img;
  }

  function fillManagerIdentity(el, manager, side) {
    el.classList.add("team-id");
    if (side) el.classList.add("team-id-" + side);
    el.textContent = "";
    const kit = manager ? kitClub(manager) : null;
    const name = document.createElement("span");
    name.className = "team-id-name";
    name.textContent = manager ? manager.name : "?";
    const crest = kit ? crestImgEl(kit.imageUrl) : null;

    if (side === "home") {
      el.appendChild(name);
      if (crest) el.appendChild(crest);
    } else {
      if (crest) el.appendChild(crest);
      el.appendChild(name);
    }
    return kit;
  }

  // Asset pack order: 0 home, 1 away, 2 keeper, 3 third, 4+ extras.
  function outfieldKitVariants(kitCount) {
    const n = Math.max(1, Math.min(6, Number(kitCount) || 1));
    const variants = [];
    if (n >= 1) variants.push(0);
    if (n >= 2) variants.push(1);
    if (n >= 4) variants.push(3);
    return variants;
  }

  function outfieldKitCount(kitCount) {
    return outfieldKitVariants(kitCount).length;
  }

  function appendKitImgs(strip, teamId, kitCount) {
    outfieldKitVariants(kitCount).forEach(function (variant, idx) {
      const img = document.createElement("img");
      img.src = kitUrl(teamId, variant);
      img.alt = "kit " + (idx + 1);
      img.loading = "lazy";
      img.onerror = function () { img.style.display = "none"; };
      strip.appendChild(img);
    });
  }

  function kitStripEl(team) {
    const strip = document.createElement("div");
    strip.className = "kit-strip";
    appendKitImgs(strip, team.id, team.kits || 3);
    return strip;
  }

  function decodeAssetBase(raw) {
    const s = String(raw || "");
    if (!s) return "";
    try {
      const decoded = atob(s);
      if (/^https?:\/\//i.test(decoded)) return decoded.replace(/\/$/, "");
    } catch (e) { /* plain url fallback */ }
    return s.replace(/\/$/, "");
  }

  function normalizeClubLabel(s) {
    return String(s || "")
      .toLowerCase()
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .replace(/\s+/g, " ")
      .trim();
  }

  function isWomenLabel(label) {
    const n = normalizeClubLabel(label);
    if (/\bwomen\b|\bladies\b|femin|\bwfc\b|lionesses\b/.test(n)) return true;
    // Women's-only clubs that share no men's twin name in the pack
    return /\b(sgs essen|ol lyonnes|fleury 91|seattle reign|portland thorns|north carolina courage|washington spirit|chicago stars|houston dash|orlando pride|racing louisville|kansas city current|gotham fc|angel city|san diego wave|costa adeje|madrid cff|alhama|rosengard|glasgow city|bay fc|utah royals|dux logrono)\b/.test(n);
  }

  function isHistoricLabel(label) {
    return /\bhistoric\b/i.test(String(label || ""));
  }

  function teamOnRoster(id) {
    return rosterByClubId.has(id) || rosterByClubId.has(String(id)) || rosterByClubId.has(Number(id));
  }

  function preferClub(a, b) {
    const aRoster = teamOnRoster(a.id);
    const bRoster = teamOnRoster(b.id);
    if (aRoster !== bRoster) return aRoster ? a : b;
    const aKits = Number(a.kits) || 0;
    const bKits = Number(b.kits) || 0;
    if (aKits !== bKits) return aKits > bKits ? a : b;
    return Number(a.id) <= Number(b.id) ? a : b;
  }

  function rebuildKitClubs() {
    if (!teamsById.size) {
      kitClubs = [];
      return;
    }
    const bestByName = new Map();
    teamsById.forEach(function (t) {
      if (isWomenLabel(t.label)) return;
      if (isHistoricLabel(t.label)) return;
      const key = normalizeClubLabel(t.label);
      if (!key) return;
      const prev = bestByName.get(key);
      bestByName.set(key, prev ? preferClub(prev, t) : t);
    });

    kitClubs = Array.from(bestByName.values()).map(function (t) {
      return {
        id: t.id,
        label: t.label,
        kits: t.kits,
        c1: t.c1,
        c2: t.c2,
        imageUrl: t.imageUrl,
        kitUrl: t.kitUrl,
      };
    }).sort(function (a, b) {
      return a.label.localeCompare(b.label);
    });
  }

  function indexTeamsCdn(pack) {
    const rawList = Array.isArray(pack) ? pack : ((pack && pack.teams) || []);
    if (pack && pack.u) assetBase = decodeAssetBase(pack.u);
    else if (pack && pack.cdn) assetBase = decodeAssetBase(pack.cdn);
    if (pack && pack.p) {
      pathCrest = pack.p.c || "";
      pathKit = pack.p.k || "";
    }
    if (pack && pack.aliases && typeof pack.aliases === "object") {
      teamAliases = pack.aliases;
    }
    const all = rawList.map(function (t) {
      return {
        id: t.id,
        label: t.n || String(t.id),
        kits: Number(t.k) || 0,
        c1: t.c1 || null,
        c2: t.c2 || null,
        imageUrl: crestUrl(t.id),
        kitUrl: kitUrl(t.id, 0),
      };
    });
    teamsById = new Map(all.map(function (t) { return [String(t.id), t]; }));
    rebuildKitClubs();
  }

  let state = defaultState();
  let draftFilter = { q: "", pos: "", type: "", minOvr: "", maxOvr: "" };
  let kitSearchByManager = {};

  function defaultState() {
    return {
      version: 1,
      phase: "setup",
      managers: [
        { id: uid(), name: "Manager 1", kitTeamId: null },
        { id: uid(), name: "Manager 2", kitTeamId: null },
        { id: uid(), name: "Manager 3", kitTeamId: null },
        { id: uid(), name: "Manager 4", kitTeamId: null },
        { id: uid(), name: "Manager 5", kitTeamId: null },
      ],
      pickOrder: [],
      picks: [],
      fixtures: [],
    };
  }

  function uid() {
    return "m_" + Math.random().toString(36).slice(2, 10);
  }

  function playerId(p) {
    return [p.team && p.team.id, p.firstName, p.lastName, p.position && p.position.id, p.overallRating].join("|");
  }

  function displayName(p) {
    if (p.commonName) return p.commonName;
    return [p.firstName, p.lastName].filter(Boolean).join(" ");
  }

  function b64ToBytes(b64) {
    const bin = atob(b64);
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  async function decryptPayload(payload, password) {
    if (payload.v !== 1) throw new Error("Unsupported payload version");
    if (payload.alg !== "aes-256-gcm") throw new Error("Unsupported algorithm");

    const salt = b64ToBytes(payload.salt);
    const iv = b64ToBytes(payload.iv);
    const tag = b64ToBytes(payload.tag);
    const ciphertext = b64ToBytes(payload.ciphertext);
    const iterations = payload.iterations || 210000;

    const enc = new TextEncoder();
    const keyMaterial = await crypto.subtle.importKey(
      "raw",
      enc.encode(password),
      "PBKDF2",
      false,
      ["deriveKey"]
    );
    const key = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt, iterations, hash: "SHA-256" },
      keyMaterial,
      { name: "AES-GCM", length: 256 },
      false,
      ["decrypt"]
    );

    const combined = new Uint8Array(ciphertext.length + tag.length);
    combined.set(ciphertext);
    combined.set(tag, ciphertext.length);

    const plainBuf = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, combined);
    return JSON.parse(new TextDecoder().decode(plainBuf));
  }

  function indexPlayers(raw) {
    players = raw.map(function (p) {
      const id = playerId(p);
      const name = displayName(p);
      const teamLabel = (p.team && p.team.label) || "";
      const pos = (p.position && p.position.shortLabel) || "";
      const type = (p.position && p.position.positionType && p.position.positionType.id) || "";
      return {
        id: id,
        displayName: name,
        search: (name + " " + teamLabel + " " + pos + " " + (p.leagueName || "")).toLowerCase(),
        overallRating: p.overallRating,
        firstName: p.firstName,
        lastName: p.lastName,
        commonName: p.commonName,
        leagueName: p.leagueName,
        nationality: p.nationality,
        team: p.team,
        position: p.position,
        posType: type,
      };
    });
    playersById = new Map(players.map(function (p) { return [p.id, p]; }));

    const map = new Map();
    players.forEach(function (p) {
      if (!p.team || p.team.id == null) return;
      if (!map.has(p.team.id)) {
        map.set(p.team.id, {
          id: p.team.id,
          label: p.team.label || String(p.team.id),
          imageUrl: crestUrl(p.team.id) || p.team.imageUrl || "",
          kitUrl: kitUrl(p.team.id, 0),
        });
      }
    });
    clubsById = map;
    clubs = Array.from(map.values()).sort(function (a, b) {
      return a.label.localeCompare(b.label);
    });

    const roster = new Map();
    players.forEach(function (p) {
      if (!p.team || p.team.id == null) return;
      roster.set(p.team.id, (roster.get(p.team.id) || 0) + 1);
    });
    rosterByClubId = roster;
    rebuildKitClubs();
  }

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {
      console.warn("localStorage save failed", e);
    }
  }

  function loadSaved() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      const parsed = JSON.parse(raw);
      if (!parsed || parsed.version !== 1) return;
      state = Object.assign(defaultState(), parsed);
    } catch (e) {

    }
  }

  function setStatus(msg, kind) {
    const el = document.getElementById("statusBar");
    el.textContent = msg;
    el.className = "status-bar" + (kind ? " " + kind : "");
  }

  function managerById(id) {
    return state.managers.find(function (m) { return m.id === id; });
  }

  function kitClub(m) {
    if (!m || m.kitTeamId == null) return null;
    const id = String(m.kitTeamId);
    for (let i = 0; i < kitClubs.length; i++) {
      if (String(kitClubs[i].id) === id) return kitClubs[i];
    }
    return teamsById.get(id) || clubsById.get(m.kitTeamId) || null;
  }

  function takenKits() {
    return new Set(
      state.managers
        .map(function (m) { return m.kitTeamId; })
        .filter(function (x) { return x != null; })
        .map(String)
    );
  }

  function draftedIds() {
    return new Set(state.picks.map(function (p) { return p.playerId; }));
  }

  function picksForManager(mid) {
    return state.picks.filter(function (p) { return p.managerId === mid; });
  }

  function snakeOrder(order, totalPicksPer) {
    const seq = [];
    for (let round = 0; round < totalPicksPer; round++) {
      const forward = round % 2 === 0;
      const slice = forward ? order.slice() : order.slice().reverse();
      slice.forEach(function (mid) { seq.push(mid); });
    }
    return seq;
  }

  function draftSequence() {
    const order = state.pickOrder.length
      ? state.pickOrder.slice()
      : state.managers.map(function (m) { return m.id; });
    return snakeOrder(order, PICKS_PER_TEAM);
  }

  function currentPickInfo() {
    const seq = draftSequence();
    const idx = state.picks.length;
    if (idx >= seq.length) return null;
    const managerId = seq[idx];
    const m = managerById(managerId);
    const soFar = picksForManager(managerId).length;
    return {
      globalIndex: idx,
      total: seq.length,
      managerId: managerId,
      manager: m,
      pickNumber: soFar + 1,
    };
  }

  function setupComplete() {
    return state.managers.length >= 2 &&
      state.managers.every(function (m) { return m.name && m.name.trim(); });
  }

  function kitsComplete() {
    return state.managers.every(function (m) { return m.kitTeamId != null; });
  }

  function orderComplete() {
    return state.pickOrder.length === state.managers.length &&
      state.managers.every(function (m) { return state.pickOrder.indexOf(m.id) !== -1; });
  }

  function draftComplete() {
    return state.picks.length === state.managers.length * PICKS_PER_TEAM;
  }

  function fixturesExist() {
    return state.fixtures.length > 0;
  }

  function maxReachablePhase() {
    if (!setupComplete()) return "setup";
    if (!kitsComplete()) return 1;
    if (!orderComplete()) return 2;
    if (!draftComplete()) return 3;
    if (!fixturesExist()) return 5;
    return 6;
  }

  function phaseRank(p) {
    if (p === "setup") return 0;
    return Number(p);
  }

  function canVisit(p) {
    const max = maxReachablePhase();
    if (p === "setup") return true;
    if (phaseRank(p) <= phaseRank(max)) return true;
    // Allow visiting completed phases and the next incomplete one
    if (p === 4 && draftComplete()) return true;
    if (p === 5 && draftComplete()) return true;
    if (p === 6 && fixturesExist()) return true;
    return phaseRank(p) <= phaseRank(max) + (max === 3 && draftComplete() ? 1 : 0);
  }

  function ensurePickOrder() {
    if (state.pickOrder.length !== state.managers.length) {
      state.pickOrder = state.managers.map(function (m) { return m.id; });
    } else {
      const ids = new Set(state.managers.map(function (m) { return m.id; }));
      state.pickOrder = state.pickOrder.filter(function (id) { return ids.has(id); });
      state.managers.forEach(function (m) {
        if (state.pickOrder.indexOf(m.id) === -1) state.pickOrder.push(m.id);
      });
    }
  }

  function shuffleIds(ids) {
    const arr = ids.slice();
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = arr[i];
      arr[i] = arr[j];
      arr[j] = t;
    }
    return arr;
  }

  function circleRoundRobin(ids) {
    // Circle method for single round-robin; returns rounds of [home, away]
    const n = ids.length;
    const arr = ids.slice();
    if (n % 2 === 1) arr.push(null); // bye
    const total = arr.length;
    const rounds = total - 1;
    const half = total / 2;
    const result = [];

    for (let r = 0; r < rounds; r++) {
      const pairs = [];
      for (let i = 0; i < half; i++) {
        const a = arr[i];
        const b = arr[total - 1 - i];
        if (a != null && b != null) {
          if (r % 2 === 0) pairs.push([a, b]);
          else pairs.push([b, a]);
        }
      }
      result.push(pairs);
      // rotate: keep first fixed
      const fixed = arr[0];
      const rest = arr.slice(1);
      const moved = rest.pop();
      if (moved !== undefined) rest.unshift(moved);
      arr.length = 0;
      arr.push(fixed);
      for (let i = 0; i < rest.length; i++) arr.push(rest[i]);
    }
    return result;
  }

  function generateFixtures(options) {
    const opts = options || {};
    let ids = state.managers.map(function (m) { return m.id; });
    // Reshuffle so regenerate produces a new schedule (deterministic order looked broken)
    if (opts.reshuffle !== false) ids = shuffleIds(ids);
    const single = circleRoundRobin(ids);
    const fixtures = [];
    let mid = 1;
    // first half
    single.forEach(function (pairs) {
      pairs.forEach(function (pair) {
        fixtures.push({
          id: "f_" + fixtures.length,
          matchday: mid,
          homeId: pair[0],
          awayId: pair[1],
          homeGoals: null,
          awayGoals: null,
        });
      });
      mid++;
    });
    // return fixtures (swap home/away)
    single.forEach(function (pairs) {
      pairs.forEach(function (pair) {
        fixtures.push({
          id: "f_" + fixtures.length,
          matchday: mid,
          homeId: pair[1],
          awayId: pair[0],
          homeGoals: null,
          awayGoals: null,
        });
      });
      mid++;
    });
    state.fixtures = fixtures;
  }

  function standings() {
    const table = {};
    state.managers.forEach(function (m) {
      table[m.id] = {
        id: m.id,
        name: m.name,
        played: 0,
        won: 0,
        drawn: 0,
        lost: 0,
        gf: 0,
        ga: 0,
        gd: 0,
        pts: 0,
      };
    });
    state.fixtures.forEach(function (f) {
      if (f.homeGoals == null || f.awayGoals == null) return;
      if (f.homeGoals === "" || f.awayGoals === "") return;
      const hg = Number(f.homeGoals);
      const ag = Number(f.awayGoals);
      if (!Number.isFinite(hg) || !Number.isFinite(ag)) return;
      const home = table[f.homeId];
      const away = table[f.awayId];
      if (!home || !away) return;
      home.played++;
      away.played++;
      home.gf += hg;
      home.ga += ag;
      away.gf += ag;
      away.ga += hg;
      if (hg > ag) {
        home.won++;
        away.lost++;
        home.pts += 3;
      } else if (hg < ag) {
        away.won++;
        home.lost++;
        away.pts += 3;
      } else {
        home.drawn++;
        away.drawn++;
        home.pts += 1;
        away.pts += 1;
      }
    });
    Object.values(table).forEach(function (r) {
      r.gd = r.gf - r.ga;
    });
    return Object.values(table).sort(function (a, b) {
      if (b.pts !== a.pts) return b.pts - a.pts;
      if (b.gd !== a.gd) return b.gd - a.gd;
      if (b.gf !== a.gf) return b.gf - a.gf;
      return a.name.localeCompare(b.name);
    });
  }

  function invalidateFrom(phase) {
    // Clear data belonging to later phases when going back / changing earlier data
    if (phaseRank(phase) < 3) {
      state.picks = [];
    }
    if (phaseRank(phase) < 5) {
      state.fixtures = [];
    }
    if (phaseRank(phase) < 2) {
      // kits change: keep order ids but fine
    }
    if (phaseRank(phase) < 1) {
      state.managers.forEach(function (m) { m.kitTeamId = null; });
      state.pickOrder = [];
      state.picks = [];
      state.fixtures = [];
    }
  }

  function goPhase(p, force) {
    if (!force && !canVisit(p) && phaseRank(p) > phaseRank(state.phase)) {
      return;
    }
    state.phase = p;
    save();
    render();
  }

  // ——— Render ———

  function renderSteps() {
    const el = document.getElementById("steps");
    el.innerHTML = "";
    PHASES.forEach(function (ph) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.textContent = ph.label;
      const active = String(state.phase) === String(ph.id);
      if (active) btn.classList.add("active");
      const reachable = canVisit(ph.id) || String(state.phase) === String(ph.id);
      btn.disabled = !reachable;
      btn.addEventListener("click", function () {
        goPhase(ph.id);
      });
      el.appendChild(btn);
    });
  }

  function render() {
    renderSteps();
    const app = document.getElementById("app");
    app.classList.remove("hidden");
    app.innerHTML = "";

    if (state.phase === "setup") renderSetup(app);
    else if (state.phase === 1) renderKits(app);
    else if (state.phase === 2) renderOrder(app);
    else if (state.phase === 3) renderDraft(app);
    else if (state.phase === 4) renderTransfers(app);
    else if (state.phase === 5) renderFixtures(app);
    else if (state.phase === 6) renderResults(app);
  }

  function navButtons(container, opts) {

      row.appendChild(back);

      const next = document.createElement("button");
      next.type = "button";
      next.className = "primary";
      next.textContent = opts.nextLabel || "Continue";
      next.disabled = !!opts.nextDisabled;
      next.addEventListener("click", opts.next);
      row.appendChild(next);
    }
    container.appendChild(row);
  }

  function renderSetup(app) {
    const panel = document.createElement("section");
    panel.className = "panel";
    panel.innerHTML = "<h2>Setup managers</h2><p class=\"hint\">Add 2–8 managers. Names are required.</p>";

    countInput.min = 2;
    countInput.max = 8;
    countInput.value = state.managers.length;
    countInput.style.maxWidth = "120px";

      let n = Math.max(2, Math.min(8, Number(countInput.value) || 2));
      countInput.value = n;
      const prev = state.managers.slice();
      if (n < prev.length && (state.picks.length || state.fixtures.length)) {

          countInput.value = state.managers.length;

  function renderKits(app) {
    const panel = document.createElement("section");
    panel.className = "panel";
    panel.innerHTML = "<h2>Phase 1 — Kit clubs</h2><p class=\"hint\">Each manager picks a unique men's club. Crests and kits load after decrypt.</p>";

        function fillList() {
          const q = (kitSearchByManager[m.id] || "").toLowerCase().trim();
          list.innerHTML = "";
          let shown = 0;
          for (let i = 0; i < catalog.length && shown < 80; i++) {

            meta.appendChild(name);

  function filterPlayers() {
    const taken = draftedIds();
    const q = (draftFilter.q || "").toLowerCase().trim();
    const pos = draftFilter.pos;
    const type = draftFilter.type;
    const minOvr = draftFilter.minOvr === "" ? null : Number(draftFilter.minOvr);
    const maxOvr = draftFilter.maxOvr === "" ? null : Number(draftFilter.maxOvr);
    const out = [];
    for (let i = 0; i < players.length; i++) {
      const p = players[i];
      if (taken.has(p.id)) continue;
      if (q && p.search.indexOf(q) === -1) continue;
      if (pos && (!p.position || p.position.shortLabel !== pos)) continue;
      if (type && p.posType !== type) continue;
      if (minOvr != null && Number.isFinite(minOvr) && p.overallRating < minOvr) continue;
      if (maxOvr != null && Number.isFinite(maxOvr) && p.overallRating > maxOvr) continue;
      out.push(p);
      if (out.length >= 120) break;
    }
    return out;
  }

  const SQUAD_GROUPS = [
    { id: "gk", label: "GK", shorts: ["GK"] },
    { id: "def", label: "DEF", shorts: ["CB", "LB", "RB", "LWB", "RWB"] },
    { id: "mid", label: "MID", shorts: ["CDM", "CM", "CAM", "LM", "RM"] },
    { id: "att", label: "ATT", shorts: ["LW", "RW", "CF", "ST"] },
  ];

  const POS_SORT = {};
  SQUAD_GROUPS.forEach(function (g, gi) {
    g.shorts.forEach(function (s, si) {
      POS_SORT[s] = gi * 20 + si;
    });
  });

  function squadGroupId(pl) {
    const short = (pl && pl.position && pl.position.shortLabel) || "";
    if (short === "GK") return "gk";
    for (let i = 0; i < SQUAD_GROUPS.length; i++) {
      if (SQUAD_GROUPS[i].shorts.indexOf(short) !== -1) return SQUAD_GROUPS[i].id;
    }
    // Fallback by broad type (data marks GK as defense)
    const type = (pl && pl.posType) || "";
    if (type === "defense") return "def";
    if (type === "midfielder") return "mid";
    if (type === "attack" || type === "forward") return "att";
    return "mid";
  }

  function renderSquadByPosition(container, managerId) {
    const picks = picksForManager(managerId);
    const grouped = { gk: [], def: [], mid: [], att: [] };

    picks.forEach(function (pick) {
      const pl = playersById.get(pick.playerId);
      if (!pl) return;
      const gid = squadGroupId(pl);
      grouped[gid].push(pl);
    });

    SQUAD_GROUPS.forEach(function (g) {
      const list = grouped[g.id].slice().sort(function (a, b) {
        const pa = POS_SORT[a.position && a.position.shortLabel] ?? 999;
        const pb = POS_SORT[b.position && b.position.shortLabel] ?? 999;
        if (pa !== pb) return pa - pb;
        return b.overallRating - a.overallRating;
      });

      const block = document.createElement("div");
      block.className = "squad-pos-group";

      const lab = document.createElement("div");
      lab.className = "squad-pos-label";
      lab.innerHTML = "<span>" + g.label + "</span><span class=\"count\">" + list.length + "</span>";
      block.appendChild(lab);

      if (!list.length) {
        const empty = document.createElement("div");
        empty.className = "squad-empty";
        empty.textContent = "—";
        block.appendChild(empty);
      } else {
        const ul = document.createElement("ul");
        list.forEach(function (pl) {
          const li = document.createElement("li");
          const pos = document.createElement("span");
          pos.className = "pos-tag";
          pos.textContent = (pl.position && pl.position.shortLabel) || "?";
          const ovr = document.createElement("span");
          ovr.className = "ovr-tag";
          ovr.textContent = String(pl.overallRating);
          const name = document.createElement("span");
          name.className = "name-tag";
          name.textContent = pl.displayName;
          name.title = pl.displayName;
          li.appendChild(pos);
          li.appendChild(ovr);
          li.appendChild(name);
          ul.appendChild(li);

        block.appendChild(ul);
      }
      container.appendChild(block);

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function buildTransferBySourceClub() {
    // clubId -> { club, total, byManager: { managerId -> [{player, manager, kit}] } }
    const byClub = new Map();

    state.picks.forEach(function (pick) {
      const pl = playersById.get(pick.playerId);
      if (!pl || !pl.team) return;
      const m = managerById(pick.managerId);
      if (!m) return;
      const kit = kitClub(m);
      // Already on destination kit — no transfer needed
      if (kit && String(pl.team.id) === String(kit.id)) return;

      const clubId = pl.team.id;
      if (!byClub.has(clubId)) {
        byClub.set(clubId, {
          club: {
            id: pl.team.id,
            label: pl.team.label || String(pl.team.id),
            imageUrl: crestUrl(pl.team.id) || pl.team.imageUrl || "",
          },
          total: 0,
          byManager: new Map(),
        });
      }
      const entry = byClub.get(clubId);
      entry.total++;
      if (!entry.byManager.has(m.id)) entry.byManager.set(m.id, []);
      entry.byManager.get(m.id).push({ player: pl, manager: m, kit: kit });
    });

    return Array.from(byClub.values()).sort(function (a, b) {
      if (b.total !== a.total) return b.total - a.total;
      return a.club.label.localeCompare(b.club.label);
    });
  }

  function normalizePersonName(s) {
    return String(s || "")
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .toLowerCase()
      .replace(/[^a-z0-9\s]/g, " ")
      .replace(/\s+/g, " ")
      .trim();
  }

  function playerMatchesPackName(pl, packName) {
    const target = normalizePersonName(packName);
    if (!target) return false;
    const last = normalizePersonName(pl.lastName);
    const common = normalizePersonName(pl.commonName);
    const full = normalizePersonName(pl.displayName);
    const firstLast = normalizePersonName([pl.firstName, pl.lastName].filter(Boolean).join(" "));

    if (last === target || common === target || full === target || firstLast === target) return true;
    if (target.indexOf(" ") !== -1) {
      if (full.indexOf(target) !== -1 || last === target || common === target) return true;
    }
    if (target.indexOf(" ") === -1) {
      if (full.endsWith(" " + target)) return true;
      if (firstLast.indexOf(target) === 0 || firstLast.endsWith(" " + target)) return true;
    }
    return false;
  }

  function clubMatchesHints(clubLabel, hints) {
    if (!hints || !hints.length) return false;
    const lab = normalizePersonName(clubLabel);
    return hints.some(function (h) {
      return lab.indexOf(normalizePersonName(h)) !== -1;
    });
  }

  function flattenOutgoing(group) {
    const out = [];
    group.byManager.forEach(function (rows) {
      rows.forEach(function (row) { out.push(row.player); });
    });
    return out;
  }

  function packHitsForClub(club, outgoingPlayers) {
    const hits = [];
    const seen = new Set();

    sidePack.forEach(function (entry) {
      if (entry.type === "club" && !clubMatchesHints(club.label, entry.clubHints || [])) return;

      outgoingPlayers.forEach(function (pl) {
        (entry.players || []).forEach(function (cp) {
          if (!playerMatchesPackName(pl, cp.name)) return;
          const key = pl.id + "|" + entry.name + "|" + cp.name;
          if (seen.has(key)) return;
          seen.add(key);
          hits.push({
            player: pl,
            packName: cp.name,
            packPos: cp.pos,
            squadName: entry.name,
            squadType: entry.type,
          });
        });
      });
    });

    return hits;
  }

  function squadInitials(label) {
    const words = String(label || "")
      .trim()
      .split(/\s+/)
      .filter(function (w) { return w && !/^xi$/i.test(w); });
    if (!words.length) return "?";
    if (words.length === 1) return words[0].slice(0, 2).toUpperCase();
    return words
      .slice(0, 3)
      .map(function (w) { return w[0]; })
      .join("")
      .toUpperCase();
  }

  function findClubByName(name) {
    const target = normalizePersonName(name);
    if (!target) return null;

    const extras = teamAliases || {};
    if (extras[target] != null) {
      const id = extras[target];
      const known = teamsById.get(String(id));
      if (known) return known;
      return { id: id, label: name, kits: 3, c1: null, c2: null, imageUrl: crestUrl(id), kitUrl: kitUrl(id, 0) };
    }

    const pool = kitClubs.length ? kitClubs : clubs;
    let best = null;
    let bestScore = 0;
    pool.forEach(function (c) {
      const lab = normalizePersonName(c.label);
      if (!lab) return;
      let score = 0;
      if (lab === target) score = 100;
      else if (lab.indexOf(target) !== -1 || target.indexOf(lab) !== -1) score = 80;
      else {
        const tParts = target.split(" ").filter(function (p) { return p.length > 2; });
        const lParts = lab.split(" ").filter(function (p) { return p.length > 2; });
        const hits = tParts.filter(function (p) {
          return lParts.some(function (lp) {
            return lp === p || lp.indexOf(p) !== -1 || p.indexOf(lp) !== -1;
          });
        });
        if (!tParts.length) return;
        const ratio = hits.length / tParts.length;
        if (ratio >= 1) score = 70;
        else if (ratio >= 0.5) score = 55;
        else if (hits.length === 1 && hits[0].length >= 5) score = 52;
      }
      if (score > bestScore) {
        bestScore = score;
        best = c;
      }
    });
    if (bestScore < 50 || !best) return null;
    return teamsById.get(String(best.id)) || {
      id: best.id,
      label: best.label,
      kits: best.kits || 0,
      c1: best.c1 || null,
      c2: best.c2 || null,
      imageUrl: best.imageUrl || crestUrl(best.id),
      kitUrl: best.kitUrl || kitUrl(best.id, 0),
    };
  }

  function appendCrestOrInitial(parent, imageUrl, label) {
    if (imageUrl) {
      const img = document.createElement("img");
      img.src = imageUrl;
      img.alt = "";
      img.className = "crest";
      parent.appendChild(img);
      return;
    }
    const badge = document.createElement("span");
    badge.className = "crest-initial";
    badge.textContent = squadInitials(label);
    badge.title = label || "";
    parent.appendChild(badge);
  }

  function buildClubsNeedingAdds(transferGroups) {
    const rows = [];

    transferGroups.forEach(function (group) {
      const outgoing = flattenOutgoing(group);
      const roster = rosterByClubId.get(group.club.id) || 0;
      const after = roster - group.total;
      const floorAdds = Math.max(0, MIN_CLUB_ROSTER - after);
      const packHits = packHitsForClub(group.club, outgoing);

      if (floorAdds > 0) {
        rows.push({
          club: group.club,
          addCount: floorAdds,
          kind: "roster",
          label: group.club.label,
          imageUrl: group.club.imageUrl || "",
        });
      }

      // Protected / special squad leavers: separate line per matched pack name
      const bySquad = new Map();
      packHits.forEach(function (hit) {
        if (!bySquad.has(hit.squadName)) bySquad.set(hit.squadName, new Set());
        bySquad.get(hit.squadName).add(hit.player.id);
      });
      bySquad.forEach(function (playerIds, squadName) {
        const matched = findClubByName(squadName);
        rows.push({
          club: group.club,
          addCount: playerIds.size,
          kind: "locked",
          label: squadName,
          imageUrl: matched && matched.imageUrl ? matched.imageUrl : "",
          kitUrl: matched && matched.kitUrl ? matched.kitUrl : "",
        });
      });
    });

    return rows.sort(function (a, b) {
      if (b.addCount !== a.addCount) return b.addCount - a.addCount;
      return String(a.label).localeCompare(String(b.label));
    });
  }

  function renderClubsNeedingAdds(panel, transferGroups) {
    const needing = buildClubsNeedingAdds(transferGroups);
    if (!needing.length) return needing;

    const section = document.createElement("div");
    section.className = "transfer-block warn";

    const h = document.createElement("h3");
    h.textContent = "Clubs that need players added";
    section.appendChild(h);

    const ul = document.createElement("ul");
    ul.style.margin = "0";
    ul.style.padding = "0";
    ul.style.listStyle = "none";
    ul.style.fontSize = "0.9rem";

    const copyLines = [];
    needing.forEach(function (row) {
      const target =
        row.kind === "locked" ? row.label + " XI" : row.label;
      const line =
        "Add " + row.addCount + " player" + (row.addCount === 1 ? "" : "s") +
        " to " + target;
      const li = document.createElement("li");
      li.className = "adds-line";
      appendCrestOrInitial(li, row.imageUrl, target);
      li.appendChild(document.createTextNode(line));
      ul.appendChild(li);
      copyLines.push(line);
    });
    section.appendChild(ul);

    const copyBtn = document.createElement("button");
    copyBtn.type = "button";
    copyBtn.textContent = "Copy";
    copyBtn.style.marginTop = "8px";
    copyBtn.addEventListener("click", function () {
      const text = copyLines.join("\n");
      navigator.clipboard.writeText(text).then(function () {
        copyBtn.textContent = "Copied";
        setTimeout(function () { copyBtn.textContent = "Copy"; }, 1200);
      }).catch(function () {
        prompt("Copy:", text);
      });
    });
    section.appendChild(copyBtn);
    panel.appendChild(section);
    return needing;
  }

  function renderTransfers(app) {
    const panel = document.createElement("section");
    panel.className = "panel";
    panel.innerHTML = "<h2>Phase 4 — Transfer summary</h2><p class=\"hint\">Grouped by source club: who leaves that club, and which manager they go to.</p>";

    const groups = buildTransferBySourceClub();
    renderClubsNeedingAdds(panel, groups);

    if (!groups.length) {
      const empty = document.createElement("p");
      empty.className = "empty";
      empty.textContent = "No transfers needed — every drafted player is already on their manager’s kit club.";
      panel.appendChild(empty);
    }

    const fullCopyLines = [];

    groups.forEach(function (group) {
      const block = document.createElement("div");
      block.className = "transfer-block";

      const h = document.createElement("h3");
      if (group.club.imageUrl) {
        const img = document.createElement("img");
        img.src = group.club.imageUrl;
        img.alt = "";
        img.className = "crest";
        h.appendChild(img);
      }
      h.appendChild(document.createTextNode(
        "From " + group.club.label + " — " + group.total + " player" + (group.total === 1 ? "" : "s")
      ));
      block.appendChild(h);

      const blockLines = ["From " + group.club.label + " — " + group.total + " players"];

      // Preserve pick-order / manager setup order
      const managerIds = state.pickOrder.length
        ? state.pickOrder
        : state.managers.map(function (m) { return m.id; });

      managerIds.forEach(function (mid) {
        const rows = group.byManager.get(mid);
        if (!rows || !rows.length) return;
        const m = rows[0].manager;
        const kit = rows[0].kit;
        const destLabel = m.name + (kit ? " (" + kit.label + ")" : "");

        const h4 = document.createElement("h4");
        h4.textContent = "→ " + destLabel + " — " + rows.length + " player" + (rows.length === 1 ? "" : "s");
        block.appendChild(h4);

        const ul = document.createElement("ul");
        const lines = [];
        rows
          .slice()
          .sort(function (a, b) { return b.player.overallRating - a.player.overallRating; })
          .forEach(function (row) {
            const pl = row.player;
            const line =
              pl.displayName +
              " · " + pl.overallRating +
              " · " + ((pl.position && pl.position.shortLabel) || "?");
            const li = document.createElement("li");
            li.textContent = line;
            ul.appendChild(li);
            lines.push("- " + line);
          });
        block.appendChild(ul);
        blockLines.push("→ " + destLabel + " (" + rows.length + ")");
        blockLines.push.apply(blockLines, lines);
      });

      fullCopyLines.push(blockLines.join("\n"));
      fullCopyLines.push("");

      const copyBtn = document.createElement("button");
      copyBtn.type = "button";
      copyBtn.textContent = "Copy this club";
      copyBtn.style.marginTop = "8px";
      copyBtn.addEventListener("click", function () {
        const text = blockLines.join("\n");
        navigator.clipboard.writeText(text).then(function () {
          copyBtn.textContent = "Copied";
          setTimeout(function () { copyBtn.textContent = "Copy this club"; }, 1200);
        }).catch(function () {
          prompt("Copy:", text);
        });
      });
      block.appendChild(copyBtn);
      panel.appendChild(block);
    });

    if (groups.length) {
      const copyAll = document.createElement("button");
      copyAll.type = "button";
      copyAll.className = "primary";
      copyAll.textContent = "Copy all transfers";
      copyAll.addEventListener("click", function () {
        const text = fullCopyLines.join("\n").trim();
        navigator.clipboard.writeText(text).then(function () {
          copyAll.textContent = "Copied";
          setTimeout(function () { copyAll.textContent = "Copy all transfers"; }, 1200);
        }).catch(function () {
          prompt("Copy:", text);
        });
      });
      panel.appendChild(copyAll);
    }

    navButtons(panel, {
      back: function () { goPhase(3); },
      nextLabel: "Continue to fixtures →",
      next: function () {
        if (!state.fixtures.length) generateFixtures();
        save();
        goPhase(5, true);
      },
    });
    app.appendChild(panel);
  }

  function renderFixtures(app) {
    const panel = document.createElement("section");
    panel.className = "panel";
    panel.innerHTML = "<h2>Phase 5 — Fixtures</h2><p class=\"hint\">Double round-robin (home and away). Generate once, then enter results in phase 6.</p>";

    const row = document.createElement("div");
    row.className = "row";
    const gen = document.createElement("button");
    gen.type = "button";
    gen.className = "primary";
    gen.textContent = state.fixtures.length ? "Regenerate fixtures" : "Generate fixtures";
    gen.addEventListener("click", function () {
      const hadFixtures = state.fixtures.length > 0;
      const hasResults = state.fixtures.some(function (f) {
        return f.homeGoals != null && f.awayGoals != null &&
          f.homeGoals !== "" && f.awayGoals !== "";
      });
      if (hadFixtures) {
        const msg = hasResults
          ? "This wipes all fixtures and results, then draws a new schedule. Continue?"
          : "Draw a new fixture schedule? Current fixtures will be replaced.";
        if (!confirm(msg)) return;
      }
      generateFixtures({ reshuffle: true });
      save();
      setStatus(
        "Fixtures " + (hadFixtures ? "regenerated" : "generated") +
          " — " + state.fixtures.length + " matches across " +
          (state.fixtures.length ? state.fixtures[state.fixtures.length - 1].matchday : 0) +
          " matchdays.",
        "ok"
      );
      render();
    });
    row.appendChild(gen);
    panel.appendChild(row);

    if (!state.fixtures.length) {
      panel.appendChild(Object.assign(document.createElement("p"), {
        className: "empty",
        textContent: "No fixtures yet. Click Generate.",
      }));
    } else {
      const byMd = {};
      state.fixtures.forEach(function (f) {
        if (!byMd[f.matchday]) byMd[f.matchday] = [];
        byMd[f.matchday].push(f);
      });
      Object.keys(byMd).map(Number).sort(function (a, b) { return a - b; }).forEach(function (md) {
        const block = document.createElement("div");
        block.className = "matchday";
        const h = document.createElement("h3");
        h.textContent = "Matchday " + md;
        block.appendChild(h);
        byMd[md].forEach(function (f) {
          const home = managerById(f.homeId);
          const away = managerById(f.awayId);
          const fr = document.createElement("div");
          fr.className = "fixture-row";

          const homeEl = document.createElement("div");
          homeEl.className = "home";
          fillManagerIdentity(homeEl, home, "home");

          const vs = document.createElement("div");
          vs.className = "vs";
          vs.textContent = "vs";

          const awayEl = document.createElement("div");
          awayEl.className = "away";
          fillManagerIdentity(awayEl, away, "away");

          fr.appendChild(homeEl);
          fr.appendChild(vs);
          fr.appendChild(awayEl);
          block.appendChild(fr);
        });
        panel.appendChild(block);
      });
    }

    navButtons(panel, {
      back: function () { goPhase(4); },
      nextLabel: "Enter results →",
      nextDisabled: !state.fixtures.length,
      next: function () {
        if (!state.fixtures.length) return;
        goPhase(6, true);
      },
    });
    app.appendChild(panel);
  }

  function renderResults(app) {
    const panel = document.createElement("section");
    panel.className = "panel";
    panel.innerHTML = "<h2>Phase 6 — Results & standings</h2><p class=\"hint\">Enter scores. Standings update automatically (3 pts win, 1 draw).</p>";

    // Standings first for visibility
    const tableWrap = document.createElement("div");
    tableWrap.style.marginBottom = "14px";
    const table = document.createElement("table");
    table.innerHTML =
      "<thead><tr>" +
      "<th>#</th><th>Manager</th>" +
      "<th class=\"num\">P</th><th class=\"num\">W</th><th class=\"num\">D</th><th class=\"num\">L</th>" +
      "<th class=\"num\">GF</th><th class=\"num\">GA</th><th class=\"num\">GD</th><th class=\"num\">Pts</th>" +
      "</tr></thead>";
    const tbody = document.createElement("tbody");
    standings().forEach(function (r, i) {
      const tr = document.createElement("tr");
      const m = managerById(r.id);
      const kit = m ? kitClub(m) : null;

      const rankTd = document.createElement("td");
      rankTd.textContent = String(i + 1);

      const nameTd = document.createElement("td");
      const cell = document.createElement("div");
      cell.className = "mgr-cell";
      const crest = kit ? crestImgEl(kit.imageUrl) : null;
      if (crest) cell.appendChild(crest);
      const name = document.createElement("span");
      name.className = "team-id-name";
      name.textContent = r.name;
      cell.appendChild(name);
      nameTd.appendChild(cell);

      tr.appendChild(rankTd);
      tr.appendChild(nameTd);
      [
        r.played, r.won, r.drawn, r.lost, r.gf, r.ga, r.gd
      ].forEach(function (v) {
        const td = document.createElement("td");
        td.className = "num";
        td.textContent = String(v);
        tr.appendChild(td);
      });
      const ptsTd = document.createElement("td");
      ptsTd.className = "num";
      const strong = document.createElement("strong");
      strong.textContent = String(r.pts);
      ptsTd.appendChild(strong);
      tr.appendChild(ptsTd);
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    tableWrap.appendChild(table);
    panel.appendChild(tableWrap);

    const byMd = {};
    state.fixtures.forEach(function (f) {
      if (!byMd[f.matchday]) byMd[f.matchday] = [];
      byMd[f.matchday].push(f);
    });

    Object.keys(byMd).map(Number).sort(function (a, b) { return a - b; }).forEach(function (md) {
      const block = document.createElement("div");
      block.className = "matchday";
      const h = document.createElement("h3");
      h.textContent = "Matchday " + md;
      block.appendChild(h);

      byMd[md].forEach(function (f) {
        const home = managerById(f.homeId);
        const away = managerById(f.awayId);
        const fr = document.createElement("div");
        fr.className = "fixture-row";

        const homeEl = document.createElement("div");
        homeEl.className = "home";
        fillManagerIdentity(homeEl, home, "home");

        const mid = document.createElement("div");
        mid.className = "score-inputs";
        const hi = document.createElement("input");
        hi.type = "number";
        hi.min = 0;
        hi.placeholder = "H";
        hi.value = f.homeGoals == null ? "" : f.homeGoals;
        const sep = document.createElement("span");
        sep.textContent = "–";
        const ai = document.createElement("input");
        ai.type = "number";
        ai.min = 0;
        ai.placeholder = "A";
        ai.value = f.awayGoals == null ? "" : f.awayGoals;

        function sync() {
          const hv = hi.value === "" ? null : Number(hi.value);
          const av = ai.value === "" ? null : Number(ai.value);
          f.homeGoals = Number.isFinite(hv) ? hv : null;
          f.awayGoals = Number.isFinite(av) ? av : null;
          save();
          render();
        }
        hi.addEventListener("change", sync);
        ai.addEventListener("change", sync);
        hi.addEventListener("keydown", function (ev) {
          if (ev.key === "Enter") { sync(); hi.blur(); }
        });
        ai.addEventListener("keydown", function (ev) {
          if (ev.key === "Enter") { sync(); ai.blur(); }
        });

        mid.appendChild(hi);
        mid.appendChild(sep);
        mid.appendChild(ai);

        const awayEl = document.createElement("div");
        awayEl.className = "away";
        fillManagerIdentity(awayEl, away, "away");

        fr.appendChild(homeEl);
        fr.appendChild(mid);
        fr.appendChild(awayEl);
        block.appendChild(fr);
      });
      panel.appendChild(block);
    });

    navButtons(panel, {
      back: function () { goPhase(5); },
    });
    app.appendChild(panel);
  }

  // ——— Toolbar ———

  document.getElementById("btnExport").addEventListener("click", function () {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "draft-tournament.json";
    a.click();
    URL.revokeObjectURL(a.href);
  });

  document.getElementById("btnImport").addEventListener("click", function () {
    document.getElementById("fileImport").click();
  });

  document.getElementById("fileImport").addEventListener("change", function (e) {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function () {
      try {
        const parsed = JSON.parse(String(reader.result));
        if (!parsed || parsed.version !== 1 || !Array.isArray(parsed.managers)) {
          throw new Error("Invalid tournament file");
        }
        if (!confirm("Replace current tournament with imported file?")) return;
        state = Object.assign(defaultState(), parsed);
        save();
        render();
        setStatus("Imported tournament (" + state.managers.length + " managers).", "ok");
      } catch (err) {
        alert("Import failed: " + err.message);
      }
    };
    reader.readAsText(file);
  });

  document.getElementById("btnReset").addEventListener("click", function () {
    if (!confirm("Reset the entire tournament? This cannot be undone (unless you exported).")) return;
    state = defaultState();
    save();
    render();
    setStatus("Tournament reset. " + players.length.toLocaleString() + " players loaded.", "ok");
  });

  // ——— Boot ———

  async function boot() {
    loadSaved();
    setStatus("Loading & decrypting player database… this may take a few seconds.");
    try {
      const [keyRes, encRes, packRes, teamsRes] = await Promise.all([
        fetch("k.txt"),
        fetch("pack-a.enc.json"),
        fetch("pack-b.enc.json"),
        fetch("pack-c.enc.json"),
      ]);
      if (!keyRes.ok) throw new Error("Could not load k.txt (" + keyRes.status + ")");
      if (!encRes.ok) throw new Error("Could not load pack-a.enc.json (" + encRes.status + ")");
      if (!packRes.ok) throw new Error("Could not load pack-b.enc.json (" + packRes.status + ")");
      if (!teamsRes.ok) throw new Error("Could not load pack-c.enc.json (" + teamsRes.status + ")");
      const password = (await keyRes.text()).trim();
      const payload = await encRes.json();
      const packPayload = await packRes.json();
      const teamsPayload = await teamsRes.json();
      const raw = await decryptPayload(payload, password);
      sidePack = await decryptPayload(packPayload, password);
      const teamsPack = await decryptPayload(teamsPayload, password);
      indexTeamsCdn(teamsPack);
      indexPlayers(raw);
      setStatus(
        players.length.toLocaleString() + " players · " +
          kitClubs.length.toLocaleString() + " clubs loaded.",
        "ok"
      );
      document.getElementById("app").classList.remove("hidden");
      render();
    } catch (err) {
      console.error(err);
      setStatus("Failed to load players: " + err.message, "error");
    }
  }

  boot();
})();
</script>
</body>
</html>
