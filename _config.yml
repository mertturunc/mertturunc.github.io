permalink: /:categories/:title/
markdown: kramdown
highlighter: rouge
plugins:
  - jekyll-redirect-from
  - jekyll-sitemap

# Sitemap configuration
sitemap:
  exclude:
    - "/script/"
    - "/vendor/"
    - "/resume/"
    - "/en/resume/"
    - "*.json"
    - "*.xml"
    - "*.pdf"
    - "/blog/pub-crawling-in-istanbul-with-tsp/"
    - "/blog/vibe-coding-a-chrome-extension/"

# Site configuration
url: "https://blog.atr0p.dev"
default_lang: "tr"
mapbox_access_token: ""

# Collections configuration
collections:
  projects:
    output: true
    permalink: /:collection/:name/

exclude:
  - "vendor"
  - "script"
  - "NUL"
  - tools/ascii-studio/_src
  - tools/ascii-studio/vite.build.config.js
  - tools/ascii-studio/verify.mjs
  - tools/ascii-studio/package.json
  - tools/ascii-studio/package-lock.json
  - tools/ascii-studio/node_modules
  - tools/ascii-studio/asset-build
  - .playwright-cli
  - .playwright
  - .playwright-mcp
defaults:
  -
    scope:
      path: "" # an empty string here means all files in the project
    values:
      layout: "post"
      starred: false
      music: false
      geo: false
      hidden: false
  -
    scope:
      path: "_projects"
      type: "projects"
    values:
      layout: "project"
      hidden: false            