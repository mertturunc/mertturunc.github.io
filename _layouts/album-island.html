<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#282828">
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}">
  <title>{{ page.title }}</title>
  <meta name="description" content="{{ page.description }}">
  <script>
    (function () {
      var savedTheme = localStorage.getItem('theme') || 'dark';
      if (savedTheme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
      var themeColor = document.querySelector('meta[name="theme-color"]');
      if (themeColor) {
        themeColor.setAttribute('content', savedTheme === 'dark' ? '#282828' : '#fbf1c7');
      }
    })();
  </script>
  <link rel="stylesheet" href="{{ '/tools/assets/css/shell.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/projects/album-island/assets/css/main.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#main">skip to catalog</a>
  <a class="album-return" href="{{ '/en/projects/' | relative_url }}">← projects</a>
  <div class="top-controls">
    <button class="theme-toggle" id="theme-toggle" type="button" aria-pressed="true" aria-label="toggle theme">
      <span id="theme-icon" aria-hidden="true">☀️</span>
    </button>
  </div>
  {{ content }}
  {% if page.guybrush %}
  <script src="{{ '/projects/album-island/assets/js/guybrush-lines.js' | relative_url }}" defer></script>
  <script src="{{ '/projects/album-island/assets/js/guybrush.js' | relative_url }}" defer></script>
  {% endif %}
  <script src="{{ '/projects/album-island/assets/js/inventory.js' | relative_url }}" defer></script>
  <script>
    (function () {
      var themeToggle = document.getElementById('theme-toggle');
      var themeIcon = document.getElementById('theme-icon');
      var html = document.documentElement;
      if (!themeToggle || !themeIcon) return;

      var currentTheme = localStorage.getItem('theme') || 'dark';

      function updateIcon(theme) {
        themeIcon.textContent = theme === 'dark' ? '☀️' : '🌙';
      }

      updateIcon(currentTheme);
      themeToggle.setAttribute(
        "aria-pressed",
        html.hasAttribute("data-theme") ? "true" : "false"
      );

      themeToggle.addEventListener('click', function () {
        var isCurrentlyDark = html.hasAttribute('data-theme');
        var newTheme = isCurrentlyDark ? 'light' : 'dark';

        if (newTheme === 'dark') {
          html.setAttribute('data-theme', 'dark');
        } else {
          html.removeAttribute('data-theme');
        }

        updateIcon(newTheme);
        themeToggle.setAttribute('aria-pressed', newTheme === 'dark' ? 'true' : 'false');
        localStorage.setItem('theme', newTheme);

        var themeColor = document.querySelector('meta[name="theme-color"]');
        if (themeColor) {
          themeColor.setAttribute('content', newTheme === 'dark' ? '#282828' : '#fbf1c7');
        }
      });
    })();
  </script>
</body>
</html>
