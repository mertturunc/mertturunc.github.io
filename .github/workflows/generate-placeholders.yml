name: Generate Placeholder Images

on:
  push:
    branches: [ main, master ]
    paths:
      - '_posts/**'
      - '.github/scripts/generate-placeholders.js'
      - '.github/workflows/generate-placeholders.yml'
  pull_request:
    paths:
      - '_posts/**'
      - '.github/scripts/generate-placeholders.js'
      - '.github/workflows/generate-placeholders.yml'

jobs:
  generate-placeholders:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install dependencies
      run: npm install

    - name: Generate placeholder images
      run: node .github/scripts/generate-placeholders.js

    - name: Confirm output
      run: |
        test -d _site/placeholders
        test "$(ls -1 _site/placeholders | wc -l)" -gt 0
        ls -la _site/placeholders
